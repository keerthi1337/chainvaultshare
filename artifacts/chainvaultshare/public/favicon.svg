<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft glow filter -->
  <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
    <feGaussianBlur stdDeviation="5" result="blur1" />
    <feGaussianBlur stdDeviation="10" result="blur2" />
    <feMerge>
      <feMergeNode in="blur2" />
      <feMergeNode in="blur1" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>

  <!-- Premium dark background capsule -->
  <rect width="180" height="180" rx="45" fill="#090a0f" stroke="#1d1e26" stroke-width="4"/>

  <!-- Glowing lines -->
  <line x1="65" y1="90" x2="115" y2="60" stroke="#ffffff" stroke-width="7" stroke-linecap="round" filter="url(#neon-glow)" opacity="0.95"/>
  <line x1="65" y1="90" x2="115" y2="120" stroke="#ffffff" stroke-width="7" stroke-linecap="round" filter="url(#neon-glow)" opacity="0.95"/>

  <!-- Core lines for sharpness -->
  <line x1="65" y1="90" x2="115" y2="60" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <line x1="65" y1="90" x2="115" y2="120" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <!-- Glowing nodes -->
  <circle cx="55" cy="90" r="14" fill="#090a0f" stroke="#ffffff" stroke-width="4" filter="url(#neon-glow)"/>
  <circle cx="125" cy="50" r="14" fill="#090a0f" stroke="#ffffff" stroke-width="4" filter="url(#neon-glow)"/>
  <circle cx="125" cy="130" r="14" fill="#090a0f" stroke="#ffffff" stroke-width="4" filter="url(#neon-glow)"/>

  <!-- Inner core for nodes -->
  <circle cx="55" cy="90" r="6" fill="#ffffff"/>
  <circle cx="125" cy="50" r="6" fill="#ffffff"/>
  <circle cx="125" cy="130" r="6" fill="#ffffff"/>
</svg>
